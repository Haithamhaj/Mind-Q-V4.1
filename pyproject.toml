[tool.poetry]
name = "mind-q-v4"
version = "0.0.0"
description = "Mind-Q Logistics — Data Intelligence Framework (v4)"
authors = ["Haitham H."]
packages = [{ include = "src" }, { include = "cli" }]

[tool.poetry.dependencies]
python = "^3.11"
polars = "*"
pyarrow = "*"
duckdb = "*"
pydantic = ">=2.0"
python-json-logger = "*"

[tool.poetry.dev-dependencies]
pytest = "*"
ruff = "*"
black = "*"
mypy = "*"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = 3.11
warn_unused_configs = true
