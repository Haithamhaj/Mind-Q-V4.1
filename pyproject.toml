[tool.poetry]
name = "mind-q-v4.1"
version = "4.1.0"
description = "Mind-Q V4.1 Logistics Intelligence Pipeline - Advanced AI-Powered Data Analytics"
authors = ["Haitham H. <haitham@mindq.ai>"]
readme = "README.md"
repository = "https://github.com/Haithamhaj/Mind-Q-V4.1"
documentation = "https://docs.mindq.ai/v4.1"
license = "MIT"
keywords = ["logistics", "ai", "analytics", "pipeline", "business-intelligence", "arabic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Natural Language :: Arabic",
    "Natural Language :: English"
]
packages = [
    { include = "src" }, 
    { include = "cli" },
    { include = "phases" },
    { include = "shared" },
    { include = "orchestration" }
]

[tool.poetry.dependencies]
python = "^3.11"

# Core Data Processing
pandas = ">=2.0.0"
polars = ">=0.20.0"
pyarrow = ">=14.0.0"
numpy = ">=1.24.0"
scipy = ">=1.10.0"

# Machine Learning & Statistics  
scikit-learn = ">=1.3.0"
statsmodels = ">=0.14.0"

# Data Validation & Quality
pydantic = ">=2.0.0"
ydata-profiling = ">=4.0.0"
great-expectations = ">=0.18.0"

# Database & Analytics
duckdb = ">=0.9.0"
sqlalchemy = ">=2.0.0"

# API & Web Framework
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"

# AI & LLM Integration
openai = ">=1.40.0"
anthropic = ">=0.25.0"
google-generativeai = ">=0.5.0"
tiktoken = ">=0.6.0"

# HTTP & Networking
httpx = ">=0.27.0"
requests = ">=2.31.0"

# Configuration & Environment
python-dotenv = ">=1.0.0"
pyyaml = ">=6.0.1"

# Logging & Monitoring
python-json-logger = ">=2.0.0"
structlog = ">=23.0.0"

# CLI & User Interface
typer = ">=0.9.0"
rich = ">=13.0.0"
click = ">=8.1.0"

# Date & Time Processing
python-dateutil = ">=2.8.0"
pytz = ">=2023.3"

[tool.poetry.group.dev.dependencies]
# Testing Framework
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"

# Code Quality & Linting
mypy = ">=1.5.0"
ruff = ">=0.0.290"
isort = ">=5.12.0"
black = ">=23.7.0"

# Pre-commit Hooks
pre-commit = ">=3.3.0"

# Documentation
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"

# Development Tools
ipython = ">=8.0.0"
jupyter = ">=1.0.0"
notebook = ">=7.0.0"

# Performance Profiling
memory-profiler = ">=0.61.0"
line-profiler = ">=4.0.0"

# Security Scanning
bandit = ">=1.7.0"
safety = ">=2.3.0"

[tool.poetry.scripts]
mindq = "cli.runner:app"
mindq-pipeline = "cli.runner:main"
mindq-validate = "cli.validator:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests", "backend/tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "arabic: marks tests with Arabic language features",
    "llm: marks tests requiring LLM API access"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "artifacts",
    "legacy"
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ARG", "S101"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | artifacts
  | legacy
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "polars.*",
    "duckdb.*",
    "ydata_profiling.*",
    "great_expectations.*",
    "anthropic.*",
    "google.generativeai.*"
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src", "cli", "phases", "shared", "orchestration"]

[tool.coverage.run]
source = ["src", "cli", "phases", "shared"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/artifacts/*",
    "*/legacy/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2
