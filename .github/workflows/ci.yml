name: CI

on:
  push:
    branches: [main, chore/repo-hygiene-runner-ci]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Black (check)
        run: python -m black --check . || true

      - name: Mypy
        run: python -m mypy --ignore-missing-imports .

      - name: Pytest
        run: python -m pytest -q || true

      - name: Smoke (non-blocking)
        run: |
          bash scripts/run_smoke.sh || \
          pwsh -File scripts/run_smoke.ps1 || \
          python -m cli.runner flow --run-id smoke-ci || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: artifacts/**

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-root

      - name: Generate PHASE_INDEX
        run: python scripts/generate_phase_index.py || true

      - name: Run smoke flow (non-blocking)
        run: |
          # run a lightweight smoke flow that writes artifacts under artifacts/smoke-ci
          poetry run python -m cli.runner flow --run-id smoke-ci || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            docs/PHASE_INDEX.json
            artifacts/smoke-ci/_summary/**
