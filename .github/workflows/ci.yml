name: ciname: CI

on: [push, pull_request]

jobs:on:

  build:  push:

    runs-on: ${{ matrix.os }}    branches: [ chore/repo-hygiene-runner-ci, main ]

    strategy:  pull_request:

      matrix: { os: [ubuntu-latest, windows-latest] }    branches: [ main ]

    steps:

      - uses: actions/checkout@v4jobs:

      - uses: actions/setup-python@v5  build:

        with: { python-version: '3.11' }    runs-on: ubuntu-latest

      - run: pip install -U pip    strategy:

      - run: pip install -r requirements.txt      matrix:

      - run: pip install -r requirements-dev.txt        python: [3.11]

      - run: ruff check .    steps:

      - run: mypy --ignore-missing-imports .      - uses: actions/checkout@v4

      - run: pytest -q || true      - name: Setup Python

      - name: Smoke        uses: actions/setup-python@v4

        run: |        with:

          bash scripts/run_smoke.sh || pwsh -File scripts/run_smoke.ps1 || python -m cli.runner flow --run-id smoke-ci || true          python-version: ${{ matrix.python }}

      - name: Upload smoke artifacts      - name: Install deps

        if: always()        run: |

        uses: actions/upload-artifact@v4          python -m pip install --upgrade pip

        with:          pip install poetry

          name: smoke-artifacts          poetry install --no-root

          path: artifacts/**      - name: Run linters

        run: |
          poetry run ruff check .
          poetry run black --check . || true
      - name: Run types
        run: |
          poetry run mypy src || true
      - name: Run tests
        run: |
          poetry run pytest -q

      smoke:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v4
          - name: Setup Python
            uses: actions/setup-python@v4
            with:
              python-version: '3.11'
          - name: Install deps
            run: |
              python -m pip install --upgrade pip
              pip install poetry
              poetry install --no-root
          - name: Generate PHASE_INDEX
            run: |
              python scripts/generate_phase_index.py || true
          - name: Run smoke flow (non-blocking)
            run: |
              # run a lightweight smoke flow that writes artifacts under artifacts/smoke-ci
              poetry run python -m cli.runner flow --run-id smoke-ci || true
          - name: Upload artifacts
            uses: actions/upload-artifact@v4
            with:
              name: smoke-artifacts
              path: |
                docs/PHASE_INDEX.json
                artifacts/smoke-ci/_summary/**
