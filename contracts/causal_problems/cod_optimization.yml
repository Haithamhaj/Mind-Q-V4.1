problem_name: "cod_optimization"
description: "Estimated effect under assumptions of COD pickup incentives on collection rate."

treatment: "cod_pickup_incentive_flag"
outcome: "cod_collection_rate"

common_causes:
  - "region"
  - "merchant_tier"
  - "delivery_channel"
  - "seasonality_week"
effect_modifiers:
  - "payment_method"
  - "parcel_weight_bucket"
instrumental_variables: []
frontdoor_variables: []

min_sample_size: 1200
confidence_level: 0.95
test_size: 0.3

estimation_methods:
  - "backdoor.psm"
  - "meta.xlearner"

refutation_tests:
  - "placebo_treatment_refuter"
  - "data_subset_refuter"
  - "add_unobserved_common_cause"

bi_publish_rule: "SUPPORTED_ONLY"
