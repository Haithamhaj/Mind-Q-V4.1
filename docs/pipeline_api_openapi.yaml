components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestionRequest:
      properties:
        data_files:
          items:
            type: string
          type: array
          title: Data Files
          description: Absolute or relative paths to the raw data files (CSV/Parquet).
        sla_files:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sla Files
          description: Optional list of SLA/SAL documents (PDF/DOCX/CSV/HTML...) to
            associate with the run.
        artifacts_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacts Root
          description: Override root directory for artifacts.
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
          description: Optional config payload merged into phase config.
        ingestion_overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ingestion Overrides
          description: Override keys applied to the ingestion sub-config (min_rows,
            etc.).
      type: object
      required:
      - data_files
      title: IngestionRequest
    PhaseRequest:
      properties:
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Inputs
          description: Explicit inputs passed to the phase runner (overrides defaults).
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
          description: Optional additional config for the phase.
        artifacts_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacts Root
          description: Override artifacts root (defaults to ./artifacts).
        use_defaults:
          type: boolean
          title: Use Defaults
          description: Whether to auto-resolve canonical inputs from prior stages
            when not provided explicitly.
          default: true
      type: object
      title: PhaseRequest
    PipelineRequest:
      properties:
        data_files:
          items:
            type: string
          type: array
          title: Data Files
          description: Raw data files for Stage 01 ingestion.
        sla_files:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sla Files
          description: Optional SLA documents passed to Stage 01.
        artifacts_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacts Root
          description: Artifacts root override.
        stop_on_error:
          type: boolean
          title: Stop On Error
          description: Whether to abort on the first phase failure.
          default: true
        llm_summary:
          type: boolean
          title: Llm Summary
          description: If true, Stage 07.6 LLM summary will be attempted (requires
            LLM credentials).
          default: false
      type: object
      required:
      - data_files
      title: PipelineRequest
    PipelineResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        phases:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Phases
      type: object
      required:
      - run_id
      - phases
      title: PipelineResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
