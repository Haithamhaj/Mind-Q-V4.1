openapi: 3.1.0
info:
  title: Mind-Q Pipeline API
  description: HTTP façade exposing Mind-Q pipeline phases for system integration.
  version: 1.0.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Healthcheck
      operationId: healthcheck_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthcheck Healthz Get
  /v1/runs/{run_id}/phases/01/ingestion:
    post:
      tags:
      - phases
      summary: Run Phase01
      operationId: run_phase01_v1_runs__run_id__phases_01_ingestion_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run Phase01 V1 Runs  Run Id  Phases 01 Ingestion Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
