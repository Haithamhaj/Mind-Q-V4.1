[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi10"
version = "0.1.0"
description = "Phase-10 BI MVP v2"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "jinja2==3.1.4",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "duckdb==1.1.3",
    "pyarrow==17.0.0",
    "jsonschema==4.23.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bi10*"]

[tool.setuptools.package-data]
"bi10" = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
